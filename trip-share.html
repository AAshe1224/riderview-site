<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wingman Trip Status</title>
<style>
  body { margin: 0; min-height: 100vh; background: #000; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; }
  .status-card { max-width: 420px; width: 100%; text-align: center; }
  .icon { font-size: 56px; margin-bottom: 16px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  .subtext { color: #999; font-size: 15px; margin: 0 0 24px; }
  .driver-info { background: #1A1512; border-radius: 14px; padding: 16px; margin-top: 16px; }
  .driver-info p { margin: 0; font-size: 15px; }
  .driver-info strong { color: #CFA054; }
  .footer-note { margin-top: 32px; color: #555; font-size: 12px; }
</style>
</head>
<body>
  <div class="status-card">
    <div class="icon" id="status-icon">🚗</div>
    <h1 id="status-text">Loading&hellip;</h1>
    <p class="subtext" id="rider-line">Ride in progress</p>
    <div class="driver-info" id="driver-info" style="display:none">
      <p><strong id="driver-name"></strong> is driving<span id="vehicle-wrap"></span></p>
    </div>
  </div>
  <p class="footer-note" id="footer-note">Powered by Wingman &mdash; no personal details shared beyond ride status.</p>

<script>
  // Static page (GitHub Pages) instead of server-rendered from Supabase --
  // Supabase rewrites GET HTML responses to text/plain on its default
  // domain, which made the original server-rendered version unusable in a
  // real browser. All data now comes from trip-share-status (JSON, CORS-
  // enabled) via fetch instead of an initial server render.
  const STATUS_API = "https://qbelcucfttpsoaywtyse.supabase.co/functions/v1/trip-share-status";

  function getToken() {
    const params = new URLSearchParams(window.location.search);
    return params.get("t");
  }

  function showError(message) {
    document.getElementById("status-icon").textContent = "⚠️";
    document.getElementById("status-text").textContent = "Link not available";
    document.getElementById("rider-line").textContent = message;
    document.getElementById("footer-note").style.display = "none";
  }

  function render(data) {
    document.getElementById("status-text").textContent = data.statusText;
    document.getElementById("rider-line").textContent = data.riderName ? data.riderName + "'s ride" : "Ride in progress";
    const driverInfo = document.getElementById("driver-info");
    if (data.driverName) {
      driverInfo.style.display = "";
      document.getElementById("driver-name").textContent = data.driverName;
      document.getElementById("vehicle-wrap").textContent = data.vehicle ? (" a " + data.vehicle) : "";
    }
    document.getElementById("status-icon").textContent =
      data.status === "completed" ? "✅" : (data.status === "cancelled" ? "❌" : "🚗");
  }

  const token = getToken();
  if (!token) {
    showError("This link is missing its tracking code.");
  } else {
    let intervalId;
    async function poll() {
      try {
        const res = await fetch(STATUS_API + "?t=" + encodeURIComponent(token));
        const data = await res.json();
        if (!res.ok || data.error) {
          showError(data.error || "This link is no longer active.");
          if (intervalId) clearInterval(intervalId);
          return;
        }
        render(data);
        if (data.status === "completed" || data.status === "cancelled") {
          if (intervalId) clearInterval(intervalId);
        }
      } catch (e) {
        // silent -- next poll will retry; first load failure is handled below
      }
    }
    poll();
    intervalId = setInterval(poll, 10000);
  }
</script>
</body>
</html>
