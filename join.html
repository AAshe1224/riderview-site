<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Join Wingman</title>
<style>
  :root { --bg: #0a0908; --surface: #161310; --surface-2: #1d1812; --border: #332a1e; --fg: #f2ede3; --muted: #a79c8a; --accent: #cfa054; --accent-fg: #151008; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  .card { max-width: 380px; width: 100%; }
  .crest { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 18px; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  .subtext { color: var(--muted); font-size: 15px; margin: 0 0 28px; }
  .code-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; margin-bottom: 10px;
  }
  .code-label { font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
  .code { font-family: "SFMono-Regular", Consolas, Menlo, monospace; font-size: 30px; font-weight: 700; letter-spacing: 6px; color: var(--accent); }
  .code-hint { font-size: 13px; color: var(--muted); margin: 10px 0 28px; }
  .btn {
    display: block; width: 100%; padding: 15px; border-radius: 12px; text-decoration: none;
    font-weight: 700; font-size: 16px; margin-bottom: 12px;
  }
  .btn-primary { background: var(--accent); color: var(--accent-fg); }
  .btn-secondary { background: var(--surface-2); color: var(--fg); border: 1px solid var(--border); font-size: 14px; font-weight: 600; }
  .footer-note { margin-top: 28px; color: #555; font-size: 12px; }
</style>
</head>
<body>
  <div class="card">
    <img class="crest" src="wingman_crest.png" alt="Wingman">
    <h1>You're invited to Wingman</h1>
    <p class="subtext">A safer way home, run by your own people.</p>

    <div class="code-box">
      <p class="code-label">Invite Code</p>
      <div class="code" id="code">------</div>
    </div>
    <p class="code-hint">Download the app, then enter this code when prompted to join your Circle.</p>

    <a class="btn btn-primary" id="download-btn" href="https://apps.apple.com/us/app/wingman-sober-rides/id6757724996">Download Wingman</a>
    <a class="btn btn-secondary" id="open-btn" href="#">Already have the app? Open now</a>
  </div>
  <p class="footer-note">Powered by Wingman</p>

<script>
  const params = new URLSearchParams(window.location.search);
  const code = params.get("code");

  if (code) {
    document.getElementById("code").textContent = code;
    const appLink = "wingman://join?code=" + encodeURIComponent(code);
    document.getElementById("open-btn").href = appLink;

    // Best-effort: if Wingman is already installed, this silently hands
    // off to it. If it isn't, nothing visible happens -- the page (with
    // its own Download button) is already fully rendered either way, so
    // there's no fallback timer or blank-screen flash to manage.
    window.location.href = appLink;
  } else {
    document.getElementById("code").textContent = "N/A";
    document.getElementById("open-btn").style.display = "none";
  }
</script>
</body>
</html>
