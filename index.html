<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wingman</title>
<link rel="stylesheet" href="styles.css">
<style>
  /* Landing page only — the one page on this site that's a brand
     moment rather than a document, so it gets centered treatment
     instead of the left-aligned reading layout the rest share. */
  body.home .page { text-align: center; }
  body.home .masthead { border-bottom: none; }
  body.home .meta-row { justify-content: center; }
  .crest { width: 140px; height: 140px; margin: 0 auto 24px; display: block; }
  .link-grid { max-width: 420px; margin-inline: auto; }
  a.link-card {
    justify-content: center;
    border-color: var(--accent);
    background: var(--surface-2);
    transition: box-shadow 0.15s ease, background 0.15s ease;
  }
  a.link-card:hover { box-shadow: 0 0 0 1px var(--accent); background: var(--surface); }
  a.link-card .arrow { display: none; }
</style>
</head>
<body class="home">
<div class="page">
  <img class="crest" src="wingman_crest.png" alt="Wingman crest">

  <div class="masthead">
    <h1 class="title">Wingman</h1>
    <div class="meta-row">
      <span>Coordinate safe, sober rides within your organization.</span>
    </div>
  </div>

  <div class="link-grid">
    <a class="link-card" href="setup.html"><span class="label">Chapter Setup Guide</span><span class="arrow">&rarr;</span></a>
    <a class="link-card" href="privacy.html"><span class="label">Privacy Policy</span><span class="arrow">&rarr;</span></a>
    <a class="link-card" href="terms.html"><span class="label">Terms of Service</span><span class="arrow">&rarr;</span></a>
    <a class="link-card" href="support.html"><span class="label">Support</span><span class="arrow">&rarr;</span></a>
  </div>
</div>
</body>
</html>
